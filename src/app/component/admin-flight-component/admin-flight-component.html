<p>admin-flight-component works!</p>
<form (ngSubmit)="addSchedule()">
    <label for="flightId">Flight ID:</label>
    <input type="number" id="flightId" [(ngModel)]="request.flightId" name="flightId"><br><br>

    <label for="fromCityId">From City:</label>
    <select id="fromCityId" [(ngModel)]="request.fromCityId" name="fromCityId">
        <option value="">Select city</option>
        <option value="1">Chennai (MAA)</option>
        <option value="2">Mumbai (BOM)</option>
        <option value="3">Delhi (DEL)</option>
        <option value="4">Bengaluru (BLR)</option>
        <option value="5">Hyderabad (HYD)</option>
    </select>

    <br><br>

    <label for="toCityId">To City:</label>
    <select id="toCityId" [(ngModel)]="request.toCityId" name="toCityId">
        <option value="">Select city</option>
        <option value="1">Chennai (MAA)</option>
        <option value="2">Mumbai (BOM)</option>
        <option value="3">Delhi (DEL)</option>
        <option value="4">Bengaluru (BLR)</option>
        <option value="5">Hyderabad (HYD)</option>
    </select>


    <label for="departureDate">Departure Date:</label>
    <input type="date" id="departureDate" [(ngModel)]="request.departureDate" name="departureDate"><br><br>

    <label for="departureTime">Departure Time:</label>
    <input type="time" id="departureTime" [(ngModel)]="request.departureTime" name="departureTime"><br><br>

    <label for="price">Price:</label>
    <input type="number" id="price" [(ngModel)]="request.price" name="price" step="0.01"><br><br>

    <label for="seatsAvailable">Seats Available:</label>
    <input type="number" id="seatsAvailable" [(ngModel)]="request.seatsAvailable" name="seatsAvailable"><br><br>

    <label for="duration">Duration (minutes):</label>
    <input type="number" id="duration" [(ngModel)]="request.duration" name="duration"><br><br>

    <button type="submit">Submit</button>
</form>

@if(error){
<p>{{errorMessage}}</p>
}

@if(success){
<p>Flight schedule added successfully!</p>
}
